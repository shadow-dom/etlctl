sources:
  - name: "pizza_db"
    type: "sqlite"
    connection:
      filepath: "/data/pizza.db"
    query: "SELECT id, name, toppings FROM pizza;"

destinations:
  - name: "delivery_db"
    type: "sqlite"
    connection:
      filepath: "/data/delivery.db"

transformations:
  - source: "pizza_db"
    target: "delivery_db.delivery"
    fields:
      - source: "id"
        target: "id"
      - source: "name"
        target: "name"
      - source: "toppings"
        target: "toppings"
