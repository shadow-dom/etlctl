apiVersion: v1
kind: Pod
metadata:
  name: rabbitmq
  namespace: etlctl
  labels:
    app: rabbitmq
spec:
  containers:
  - name: rabbitmq
    image: rabbitmq:3-management-alpine
    ports:
    - containerPort: 5672
      name: amqp
    - containerPort: 15672
      name: management
    readinessProbe:
      tcpSocket:
        port: 5672
      initialDelaySeconds: 10
      periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: etlctl
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
